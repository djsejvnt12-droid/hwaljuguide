<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전사 계열 스킬 가이드</title>
  <style>
    body { background-color: #0a192f; color: #e6edf3; font-family: sans-serif; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .video-section { display: none; background: #112240; padding: 20px; border-radius: 10px; }
    .video-section.active { display: block; }
    video { width: 100%; border-radius: 8px; }
    .tab-btn { background: #112240; border: 1px solid #64ffda; color: #64ffda; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>전사 계열 스킬 가이드</h1>
  
  <div class="tab-container">
    <button class="tab-btn" onclick="showJob('hero')">히어로</button>
    <!-- 나머지 버튼 동일 -->
  </div>

  <div id="hero" class="video-section active">
    <video controls>
      <!-- 여기가 핵심입니다. 주소를 수정했습니다 -->
      <source src="https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/video/1.mp4" type="video/mp4">
    </video>
  </div>
</div>

<script>
  function showJob(id) {
    document.querySelectorAll('.video-section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
