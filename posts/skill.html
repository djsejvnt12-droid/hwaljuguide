<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스킬 가이드</title>
  <style>
    @font-face {
      font-family: 'MapleStory';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2.1/MapleStoryOTFBold.woff') format('woff');
      font-weight: bold;
    }
    body, a, button { cursor: url('https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/akdntm2.png'), auto !important; }
    body { 
      background: linear-gradient(rgba(30, 30, 40, 0.9), rgba(20, 20, 25, 0.95)), 
                  url('https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/back3.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ede0d4; 
      font-family: 'MapleStory', sans-serif; 
      margin: 0; padding: 40px 20px; 
    }

    .post-container { 
      max-width: 800px; margin: 0 auto; 
      background: #2a2522; 
      padding: 40px; border-radius: 4px; 
      border: 2px solid #5c4d3d;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
    }

    /* 고정 영상 영역 */
    #video-player { 
      position: sticky; top: 20px; 
      background: #3c3530; 
      padding: 15px; border-radius: 2px; 
      text-align: center; border: 2px solid #5c4d3d; 
      z-index: 100; margin-bottom: 30px;
    }
    video { width: 100%; max-height: 400px; background: black; border: 2px solid #5c4d3d; }
    
    h1 { color: #fdf6e3; text-align: center; margin-top: 0; text-shadow: 2px 2px 0 #000; }
    h2 { color: #e6ccb2; margin-top: 40px; border-left: 8px solid #a47148; padding-left: 15px; }
    
    .back-btn { 
      display: inline-block; margin-bottom: 20px; color: #d4b483; 
      text-decoration: none; font-weight: bold; border: 2px outset #7a614a; 
      padding: 5px 15px; transition: 0.3s;
    }
    .back-btn:hover { background: #3c3530; border-style: inset; }
    
    .job-group { margin-bottom: 25px; }
    .job-btn { 
      display: inline-block; margin: 5px; 
      background: #3c3530; border: 2px outset #7a614a; 
      color: #ede0d4; padding: 8px 15px; cursor: pointer; font-weight: bold;
      transition: 0.3s;
    }
    .job-btn:hover { background: #5c4d3d; border-style: inset; color: #fdf6e3; }
  </style>
</head>
<body>

<div class="post-container">
  <a href="../index.html" class="back-btn">← 메인으로 돌아가기</a>
  
  <div id="video-player">
    <h3 id="video-title" style="margin-top:0; color: #e6ccb2;">직업을 선택하세요</h3>
    <video id="main-video" controls>
      <source id="video-source" src="" type="video/mp4">
    </video>
  </div>

  <h1>직업별 단일, 범위 스킬 이펙트</h1>

  <div class="job-group">
    <h2>전사 계열</h2>
    <button class="job-btn" onclick="play(1, '히어로')">히어로</button>
    <button class="job-btn" onclick="play(2, '팔라딘')">팔라딘</button>
    <button class="job-btn" onclick="play(3, '다크나이트')">다크나이트</button>
    <button class="job-btn" onclick="play(4, '소드마스터')">소드마스터</button>
    <button class="job-btn" onclick="play(5, '아란')">아란</button>
  </div>

  <div class="job-group">
    <h2>법사 계열</h2>
    <button class="job-btn" onclick="play(6, '비숍')">비숍</button>
    <button class="job-btn" onclick="play(7, '썬콜')">썬콜</button>
    <button class="job-btn" onclick="play(8, '불독')">불독</button>
    <button class="job-btn" onclick="play(9, '에반')">에반</button>
    <button class="job-btn" onclick="play(10, '배틀메이지')">배틀메이지</button>
    <button class="job-btn" onclick="play(11, '플레임위자드')">플레임위자드</button>
  </div>

  <div class="job-group">
    <h2>도적 계열</h2>
    <button class="job-btn" onclick="play(12, '나이트로드')">나이트로드</button>
    <button class="job-btn" onclick="play(13, '섀도어')">섀도어</button>
    <button class="job-btn" onclick="play(14, '듀얼블레이드')">듀얼블레이드</button>
    <button class="job-btn" onclick="play(15, '나이트워커')">나이트워커</button>
  </div>

  <div class="job-group">
    <h2>궁수 계열</h2>
    <button class="job-btn" onclick="play(16, '보우마스터')">보우마스터/윈드브레이커</button>
    <button class="job-btn" onclick="play(17, '신궁')">신궁</button>
    <button class="job-btn" onclick="play(18, '와일드헌터')">와일드헌터</button>
  </div>

  <div class="job-group">
    <h2>해적 계열</h2>
    <button class="job-btn" onclick="play(19, '바이퍼')">바이퍼</button>
    <button class="job-btn" onclick="play(20, '캡틴')">캡틴</button>
    <button class="job-btn" onclick="play(21, '스트라이커')">스트라이커</button>
    <button class="job-btn" onclick="play(22, '메카닉')">메카닉</button>
  </div>
</div>

<script>
  function play(id, name) {
    document.getElementById('video-title').innerText = name + " 단일, 범위 가이드";
    const video = document.getElementById('main-video');
    const source = document.getElementById('video-source');
    source.src = `https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/video/${id}.mp4`;
    video.load();
    video.play();
  }
</script>

</body>
</html>
