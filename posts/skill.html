<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스킬 가이드</title>
  <style>
    body { background-color: #0a192f; color: #e6edf3; font-family: sans-serif; margin: 0; padding: 40px; }
    .post-container { max-width: 800px; margin: 0 auto; background: #112240; padding: 40px; border-radius: 10px; border: 1px solid #64ffda; }
    
    /* 고정 영상 영역 */
    #video-player { position: sticky; top: 20px; background: #0a192f; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #64ffda; z-index: 100; }
    video { width: 100%; max-height: 400px; border-radius: 5px; background: black; }
    
    /* 버튼 및 스타일 */
    h1 { color: #ffffff; text-align: center; }
    h2 { color: #ffffff; margin-top: 30px; border-bottom: 2px solid #64ffda; padding-bottom: 10px; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: #64ffda; text-decoration: none; font-size: 1.1em; }
    .back-btn:hover { text-shadow: 0 0 8px #64ffda; }
    
    .job-group { margin-bottom: 25px; }
    .job-btn { display: inline-block; margin: 5px; background: #0a192f; border: 1px solid #64ffda; color: #64ffda; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
    .job-btn:hover { background: #64ffda; color: #0a192f; }
  </style>
</head>
<body>

<div class="post-container">
  <!-- 버튼 디자인 수정 -->
  <a href="../index.html" class="back-btn">← 메인으로 돌아가기</a>
  
  <!-- 영상이 화면 상단에 고정됨 -->
  <div id="video-player">
    <h3 id="video-title" style="margin-top:0;">직업을 선택하세요</h3>
    <video id="main-video" controls>
      <source id="video-source" src="" type="video/mp4">
    </video>
  </div>

  <h1>직업별 단일, 범위 스킬 이펙트</h1>

  <div class="job-group">
    <h2>전사 계열</h2>
    <button class="job-btn" onclick="play(1, '히어로')">히어로</button>
    <button class="job-btn" onclick="play(2, '팔라딘')">팔라딘</button>
    <button class="job-btn" onclick="play(3, '다크나이트')">다크나이트</button>
    <button class="job-btn" onclick="play(4, '소드마스터')">소드마스터</button>
    <button class="job-btn" onclick="play(5, '아란')">아란</button>
  </div>

  <div class="job-group">
    <h2>법사 계열</h2>
    <button class="job-btn" onclick="play(6, '비숍')">비숍</button>
    <button class="job-btn" onclick="play(7, '썬콜')">썬콜</button>
    <button class="job-btn" onclick="play(8, '불독')">불독</button>
    <button class="job-btn" onclick="play(9, '에반')">에반</button>
    <button class="job-btn" onclick="play(10, '배틀메이지')">배틀메이지</button>
    <button class="job-btn" onclick="play(11, '플레임위자드')">플레임위자드</button>
  </div>

  <div class="job-group">
    <h2>도적 계열</h2>
    <button class="job-btn" onclick="play(12, '나이트로드')">나이트로드</button>
    <button class="job-btn" onclick="play(13, '섀도어')">섀도어</button>
    <button class="job-btn" onclick="play(14, '듀얼블레이드')">듀얼블레이드</button>
    <button class="job-btn" onclick="play(15, '나이트워커')">나이트워커</button>
  </div>

  <div class="job-group">
    <h2>궁수 계열</h2>
    <button class="job-btn" onclick="play(16, '보우마스터')">보우마스터</button>
    <button class="job-btn" onclick="play(17, '신궁')">신궁</button>
    <button class="job-btn" onclick="play(18, '와일드헌터')">와일드헌터</button>
  </div>

  <div class="job-group">
    <h2>해적 계열</h2>
    <button class="job-btn" onclick="play(19, '바이퍼')">바이퍼</button>
    <button class="job-btn" onclick="play(20, '캡틴')">캡틴</button>
    <button class="job-btn" onclick="play(21, '스트라이커')">스트라이커</button>
    <button class="job-btn" onclick="play(22, '메카닉')">메카닉</button>
  </div>
</div>

<script>
  function play(id, name) {
    document.getElementById('video-title').innerText = name + " 단일, 범위 가이드";
    const video = document.getElementById('main-video');
    const source = document.getElementById('video-source');
    source.src = `https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/video/${id}.mp4`;
    video.load();
    video.play();
  }
</script>

</body>
</html>
