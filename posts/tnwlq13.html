<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>크리세 안경 퀘스트 가이드</title>
  <style>
    @font-face {
      font-family: 'MapleStory';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2.1/MapleStoryOTFBold.woff') format('woff');
      font-weight: bold;
    }
    body, a, button { cursor: url('https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/akdntm2.png'), auto !important; }
    body { 
      background: linear-gradient(rgba(45, 60, 30, 0.8), rgba(20, 30, 15, 0.9)), 
                  url('https://raw.githubusercontent.com/djsejvnt12-blob/hwaljuguide/main/images/back.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #faedcd; 
      font-family: 'MapleStory', sans-serif; 
      margin: 0; padding: 40px 20px; 
    }

    .post-container { 
      max-width: 800px; margin: 0 auto; 
      background: rgba(60, 45, 30, 0.85); 
      padding: 40px; border-radius: 15px; 
      border: 3px solid #d4a373;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 { color: #ffe066; text-align: center; margin-top: 0; text-shadow: 2px 2px 0 #5d4037; border-bottom: 2px solid #d4a373; padding-bottom: 10px; }
    h2 { color: #ccd5ae; margin-top: 40px; border-bottom: 2px solid #d4a373; padding-bottom: 10px; }
    p { line-height: 1.8; color: #faedcd; }

    .summary-box { 
      background: rgba(80, 60, 40, 0.6); 
      padding: 20px; border-left: 5px solid #ff6b6b; 
      margin: 20px 0; border-radius: 5px;
    }
    
    .highlight { color: #ffeb99; font-weight: bold; }
    
    .back-btn { 
      display: inline-block; margin-bottom: 20px; color: #ffeb99; 
      text-decoration: none; font-weight: bold; border: 1px solid #ffeb99; 
      padding: 5px 15px; border-radius: 20px; transition: 0.3s;
    }
    .back-btn:hover { background: #ffeb99; color: #5a4635; }
    
    img { 
      max-width: 100%; border-radius: 10px; margin: 20px 0; 
      display: block; border: 3px solid #d4a373; 
    }
    
    li { margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="post-container">
  <a href="../index.html" class="back-btn">← 메인으로 돌아가기</a>
  
  <h1>크리세 안경 퀘스트 가이드</h1>

  <div class="summary-box">
    <p><strong>핵심 요약</strong></p>
    <ul>
      <li>오르비스 공원 에릭손 연계 퀘스트</li>
      <li>준비물 없음, 보스 반복 처치 필요</li>
      <li>완료 보상: <span class="highlight">총 추가 데미지 4,000만</span> (각 2,000만)</li>
    </ul>
  </div>

  <h2>진행 절차</h2>
  <ol>
    <li>오르비스 공원의 '에릭손'과 대화 후 퀘스트 수락</li>
    <li>크리세로 이동</li>
    <li>우측 끝 맵까지 이동</li>
    <li>안경 두 종류가 드롭될 때까지 보스 반복 처치</li>
  </ol>

  <h2>참고 이미지</h2>
  <img src="https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/bb7.png" alt="참고 이미지 1">
  <img src="https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/bb8.png" alt="참고 이미지 2">
</div>

</body>
</html>
