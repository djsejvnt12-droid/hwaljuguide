<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>크리세 안경 퀘스트 가이드</title>
  <style>
    @font-face {
      font-family: 'MapleStory';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2.1/MapleStoryOTFBold.woff') format('woff');
      font-weight: bold;
    }
    body, a, button { cursor: url('https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/akdntm2.png'), auto !important; }
    body { 
      background: linear-gradient(rgba(30, 30, 40, 0.9), rgba(20, 20, 25, 0.95)), 
                  url('https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/back3.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ede0d4; 
      font-family: 'MapleStory', sans-serif; 
      margin: 0; padding: 40px 20px; 
    }

    .post-container { 
      max-width: 800px; margin: 0 auto; 
      background: #2a2522; 
      padding: 40px; border-radius: 4px; 
      border: 2px solid #5c4d3d;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
    }

    h1 { color: #fdf6e3; text-align: center; margin-top: 0; text-shadow: 2px 2px 0 #000; border-bottom: 2px solid #5c4d3d; padding-bottom: 10px; }
    h2 { color: #e6ccb2; margin-top: 40px; border-left: 8px solid #a47148; padding-left: 15px; }
    p { line-height: 1.8; color: #ede0d4; }
    
    .back-btn { 
      display: inline-block; margin-bottom: 20px; color: #d4b483; 
      text-decoration: none; font-weight: bold; border: 2px outset #7a614a; 
      padding: 5px 15px; transition: 0.3s;
    }
    .back-btn:hover { background: #3c3530; border-style: inset; }

    .summary-box { 
      background: #3c3530; 
      padding: 20px; border-left: 8px solid #cc4444; 
      margin: 20px 0; border-radius: 2px;
    }
    
    .highlight { color: #fdf6e3; font-weight: bold; }
    
    ul, ol { line-height: 2; color: #dcd7c9; }
    li { margin-bottom: 10px; }
    
    img { max-width: 100%; border-radius: 2px; margin: 20px 0; border: 2px solid #5c4d3d; display: block; }
  </style>
</head>
<body>

<div class="post-container">
  <a href="../index.html" class="back-btn">← 메인으로 돌아가기</a>
  
  <h1>크리세 안경 퀘스트 가이드</h1>

  <div class="summary-box">
    <p><strong>핵심 요약</strong></p>
    <ul>
      <li>오르비스 공원 에릭손 연계 퀘스트</li>
      <li>준비물 없음, 보스 반복 처치 필요</li>
      <li>완료 보상: <span class="highlight">총 추가 데미지 4,000만</span> (각 2,000만)</li>
    </ul>
  </div>

  <h2>진행 절차</h2>
  <ol>
    <li>오르비스 공원의 '에릭손'과 대화 후 퀘스트 수락</li>
    <li>크리세로 이동</li>
    <li>우측 끝 맵까지 이동</li>
    <li>안경 두 종류가 드롭될 때까지 보스 반복 처치</li>
  </ol>

  <h2>참고 이미지</h2>
  <img src="https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/bb7.png" alt="참고 이미지 1">
  <img src="https://raw.githubusercontent.com/djsejvnt12-droid/hwaljuguide/main/images/bb8.png" alt="참고 이미지 2">
</div>

</body>
</html>
