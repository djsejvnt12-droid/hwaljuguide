<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>활주 서버 가이드</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/dark.css">
  <style>
    /* 전체 배경을 진청색(네이비)으로 변경 */
    body { background-color: #0a192f !important; color: #e6edf3 !important; }
    
    /* 사이드바 숨김 */
    aside.sidebar { display: none !important; }
    section.content { padding-left: 0 !important; max-width: 1200px !important; margin: 0 auto; }
    
    /* 상단 메인 문구 스타일 */
    .header-section { text-align: center; padding: 50px 20px; }
    .header-section h1 { color: #64ffda; font-size: 3em; margin-bottom: 10px; }
    
    /* 카드 1줄 4개 배치 */
    .card-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
    
    /* 카드 디자인 */
    .card { background: #112240; border: 1px solid #233554; border-radius: 12px; padding: 20px; text-decoration: none; transition: 0.3s; }
    .card:hover { border-color: #64ffda; transform: translateY(-5px); background: #1a3059; }
    
    /* 폰트 색상 및 스타일 */
    .card h3 { color: #ccd6f6; margin-top: 0; }
    .card p { color: #8892b0; font-size: 0.9em; } /* 밝은 회색으로 변경 */
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '',
      loadSidebar: false
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
