<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>활주 서버 가이드</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/dark.css">
  <style>
    :root { --sidebar-width: 0; }
    body { background-color: #0d1117; color: #c9d1d9; }
    .card-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; text-decoration: none; color: inherit; transition: 0.3s; }
    .card:hover { border-color: #58a6ff; transform: translateY(-5px); }
    h1 { color: #58a6ff; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '활주 서버 가이드(제작자_by 비글)',
      loadNavbar: false,
      loadSidebar: false
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
