<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>활주 서버 가이드</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/dark.css">
  <style>
    /* 전체 배경색 강제 적용 */
    body { background-color: #0a192f !important; }
    
    /* 타이머 박스 */
    #timer-box { position: fixed; top: 20px; left: 20px; background: #112240; padding: 15px; border-radius: 10px; border: 1px solid #64ffda; color: #64ffda; font-weight: bold; z-index: 1000; font-size: 0.9em; }

    /* 메인 디자인 */
    .markdown-section { max-width: 1000px !important; margin: 0 auto !important; padding: 40px !important; background: #112240 !important; border-radius: 15px !important; border: 1px solid #233554 !important; }
    
    /* 카드 디자인 */
    .card-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1000px; margin: 50px auto; }
    .card { background: #112240; border: 1px solid #233554; border-radius: 10px; padding: 20px; text-decoration: none; color: #e6edf3; text-align: center; }
    .card:hover { border-color: #64ffda; background: #1a3059; }
  </style>
</head>
<body>

  <div id="timer-box">
    <div id="boss-timer">월드보스: 계산 중...</div>
    <div id="hot-timer" style="color: #ffd700; margin-top: 5px;">핫타임: 계산 중...</div>
  </div>

  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '활주 서버 가이드',
      repo: false,
      loadNavbar: false,
      auto2top: true
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <script>
    const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
    
    // 첫 페이지(메인)일 때 카드 표시
    if (window.location.hash === '' || window.location.hash === '#/') {
      document.getElementById('app').innerHTML = `
        <h1 style="text-align:center; color:#fff; margin-top:50px;">Hwalju Server Guide</h1>
        <div class="card-container">
          <a href="#/posts/title1.md" class="card"><h3>서버홍보 가이드</h3></a>
          <a href="#/posts/title2.md" class="card"><h3>제목 2</h3></a>
        </div>
      `;
    }

    function updateTimers() {
      const now = new Date();
      const kst = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 60 * 60 * 1000));
      const bossTargets = [13, 22];
      let nextBoss = null;
      for (let h of bossTargets) {
        let t = new Date(kst); t.setHours(h, 0, 0, 0);
        if (t > kst) { nextBoss = t; break; }
      }
      if (!nextBoss) { nextBoss = new Date(kst); nextBoss.setDate(nextBoss.getDate() + 1); nextBoss.setHours(bossTargets[0], 0, 0, 0); }
      
      let nextHot = new Date(kst); nextHot.setHours(21, 0, 0, 0);
      if (nextHot <= kst) nextHot.setDate(nextHot.getDate() + 1);

      function getDiff(t) {
        const d = t - kst;
        const h = Math.floor(d / 3600000);
        const m = Math.floor((d % 3600000) / 60000);
        const s = Math.floor((d % 60000) / 1000);
        return `${h}시간 ${m}분 ${s}초 전`;
      }
      document.getElementById('boss-timer').innerText = `월드보스: ${getDiff(nextBoss)}`;
      document.getElementById('hot-timer').innerText = `핫타임: ${getDiff(nextHot)}`;
    }
    setInterval(updateTimers, 1000);
    updateTimers();
    document.body.addEventListener('click', () => { alertSound.play(); alertSound.pause(); }, { once: true });
  </script>
</body>
</html>
