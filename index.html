<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>활주서버 가이드</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/dark.css">
  <style>
    /* 예시 사이트와 동일한 폰트 및 배경 느낌 */
    body { font-family: 'Segoe UI', sans-serif; }
    .sidebar { background-color: #1b1b1b !important; }
    .markdown-section { max-width: 800px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '활주서버 가이드', // 사이트 왼쪽 상단 이름
      loadSidebar: true,     // 사이드바 사용
      subMaxLevel: 3,        // 목차 깊이
      search: 'auto'         // 검색 기능
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
