<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>활주 서버 가이드</title>
  <style>
    /* 전체 배경을 진청색(네이비)으로 설정 */
    body { background-color: #0a192f; color: #e6edf3; font-family: sans-serif; margin: 0; padding: 0; }
    
    /* 카드 레이아웃: 1줄에 4개씩 자동 정렬 */
    .header-section { text-align: center; padding: 60px 20px; }
    .header-section h1 { font-size: 2.5em; margin: 0; color: #ffffff; }
    
    .card-container { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 20px; 
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 0 20px 50px 20px;
    }
    
    /* 카드 디자인 */
    .card { 
      background: #112240; 
      border: 1px solid #233554; 
      border-radius: 10px; 
      padding: 25px 15px; 
      text-decoration: none; 
      color: #e6edf3; 
      text-align: center;
      transition: 0.3s; 
    }
    .card:hover { border-color: #64ffda; background: #1a3059; transform: translateY(-5px); }
    .card h3 { margin: 0 0 10px 0; font-size: 1.1em; }
    .card p { margin: 0; color: #8892b0; font-size: 0.85em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = { loadSidebar: false, name: '' }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
